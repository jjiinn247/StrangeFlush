<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strange Flush</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  *, *::before, *::after {
    box-sizing: border-box; margin: 0; padding: 0;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  a, button { outline: none; }
  .cw { user-select: none; -webkit-user-select: none; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #100808;
    font-family: 'Pretendard', sans-serif;
    color: #fff;
  }

  #bg {
    position: fixed; inset: 0; z-index: 0;
    background: url('concept image.jpg') center 30% / cover no-repeat;
    filter: brightness(0.45) saturate(1.3);
  }
  #overlay {
    position: fixed; inset: 0; z-index: 1;
    background: radial-gradient(ellipse 70% 60% at 50% 50%,
      rgba(8,2,2,0) 0%, rgba(8,2,2,0.45) 55%, rgba(8,2,2,0.85) 100%);
    pointer-events: none;
  }
  #card-field {
    position: fixed; inset: 0; z-index: 2;
    pointer-events: none;
  }

  /* ── 카드 ── */
  .cw {
    position: absolute;
    pointer-events: auto;
    transform-origin: center center;
    transform: translate(-50%, -50%) rotate(var(--r, 0deg)) scale(var(--s, 1));
    perspective: 700px;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor: pointer;
    will-change: transform;
  }
  /* 카드 복귀 시 부드러운 이징 */
  .cw.returning {
    transition: transform 0.42s cubic-bezier(0.4, 0, 0.2, 1) !important;
  }

  /* 데스크탑: 호버 뒤집기 */
  @media (hover: hover) {
    .cw:hover {
      transform: translate(-50%, -50%) rotate(0deg) scale(calc(var(--s, 1) * 1.08)) translateY(-20px);
      z-index: 100;
    }
    .cw:hover .ci { transform: rotateY(180deg); }
    .cw:hover .cfront,
    .cw:hover .cmsg  { pointer-events: auto; }
  }

  /* 모바일: 탭 → 화면 중앙으로 떠오름 (로고 위) */
  @media (hover: none) {
    .cw.flipped {
      transform: translate(
        calc(-50% + 50vw - var(--ox)),
        calc(-50% + 46vh - var(--oy))
      ) rotate(0deg) scale(2.1);
      z-index: 200;
    }
    .cw.flipped .ci   { transform: rotateY(180deg); }
    .cw.flipped .cfront,
    .cw.flipped .cmsg { pointer-events: auto; }
  }

  /* 앞면은 기본 비활성 (뒤집혔을 때만 탭 가능) */
  .cfront, .cmsg { pointer-events: none; }

  .ci {
    width: 108px; height: 162px;
    transform-style: preserve-3d;
    transition: transform 0.5s ease 0.08s;
  }
  .cf {
    position: absolute; inset: 0; border-radius: 9px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }

  /* 뒷면 */
  .cb {
    background: linear-gradient(145deg, #8e0022, #6a0018, #8e0022);
    border: 2px solid #aa0028; overflow: hidden;
  }
  .cb::before {
    content: ''; position: absolute; inset: 7px;
    border: 1px solid rgba(180,0,40,0.5); border-radius: 5px; z-index: 1;
  }
  .cb-hatch {
    position: absolute; inset: 0; border-radius: 9px;
    background-image:
      repeating-linear-gradient(45deg,  rgba(0,0,0,0.15) 0, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 9px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,0.15) 0, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 9px);
  }
  .cb-s {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    font-size: 3.6rem; color: rgba(255,255,255,0.1);
    line-height: 1; user-select: none; z-index: 2;
  }

  /* 앞면 (작가) */
  .cfront {
    background: linear-gradient(150deg, #faf6ee, #ede4d4);
    border: 2px solid #c5bcaa;
    transform: rotateY(180deg);
    display: flex; flex-direction: column;
    padding: 6px 5px; overflow: hidden;
  }
  .corner { display: flex; flex-direction: column; align-items: center; width: 18px; line-height: 1.1; }
  .corner .rk { font-family: 'Pretendard', sans-serif; font-weight: 700; font-size: 0.76rem; line-height: 1; }
  .corner .st { font-size: 0.62rem; line-height: 1; }
  .c-tl { align-self: flex-start; }
  .c-br { align-self: flex-end; transform: rotate(180deg); margin-top: auto; }
  .cmid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 0; }
  .suits-row { display: flex; gap: 5px; font-size: 1.35rem; line-height: 1; }
  .cname { font-family: 'Pretendard', sans-serif; font-size: 0.68rem; font-weight: 600; color: #1a0808; text-align: center; white-space: nowrap; line-height: 1.2; text-decoration: none; display: block; }
  .chandle { font-family: 'Pretendard', sans-serif; font-size: 0.42rem; color: #5a1a28; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; text-decoration: none; display: block; }
  .chandle:hover, .cname:hover { text-decoration: underline; }
  .sr { color: #cc0000; }
  .sb { color: #1a0808; }

  /* 앞면 (메시지) */
  .cmsg {
    background: linear-gradient(150deg, #faf6ee, #ede4d4);
    border: 2px solid #c5bcaa; transform: rotateY(180deg);
    display: flex; align-items: center; justify-content: center;
    padding: 14px 10px; text-align: center; border-radius: 9px;
  }
  .cmsg-text { font-family: 'Pretendard', sans-serif; font-size: 0.56rem; font-weight: 400; color: #2a0a10; line-height: 1.65; word-break: keep-all; }

  /* 히어로 */
  #hero { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  #logo-link { display: block; pointer-events: auto; cursor: pointer; text-decoration: none; }
  #logo-img { display: block; width: min(420px, 62vw); height: auto; filter: invert(1); mix-blend-mode: screen; }

  #hero-text {
    position: fixed; left: 50%; top: calc(50% + min(210px, 21vw) + 1rem);
    transform: translateX(-50%); z-index: 1;
    text-align: center; line-height: 1.7; pointer-events: none; white-space: nowrap;
  }
  #hero-text .line1 { font-size: clamp(0.6rem, 1.4vw, 0.82rem); font-weight: 400; letter-spacing: 0.22em; color: rgba(255,255,255,0.7); }
  #hero-text .line2 { font-size: clamp(0.75rem, 1.8vw, 1rem); font-weight: 600; letter-spacing: 0.45em; color: #fff; }

  /* ── 모바일 크기 ── */
  @media (max-width: 768px) {
    #hero-text { display: none; }
    #logo-img  { width: min(240px, 62vw); }
    .ci        { width: 72px; height: 108px; }
    .cb-s      { font-size: 2.4rem; }
    .cb::before { inset: 5px; }
    .cf        { border-radius: 6px; }
    .corner    { width: 13px; }
    .corner .rk { font-size: 0.5rem; }
    .corner .st { font-size: 0.4rem; }
    .suits-row  { font-size: 0.9rem; gap: 3px; }
    .cname     { font-size: 0.44rem; }
    .chandle   { font-size: 0.3rem; max-width: 60px; }
    .cfront    { padding: 4px 3px; }
    .cmsg      { padding: 8px 6px; }
    .cmsg-text { font-size: 0.38rem; }
    .cmid      { gap: 5px; }
  }
</style>
</head>
<body>

<div id="bg"></div>
<div id="overlay"></div>
<div id="card-field"></div>

<div id="hero">
  <a id="logo-link" href="https://x.com/ncejanthology" target="_blank" rel="noopener">
    <img id="logo-img" src="stangeflush-logo2-title.png" alt="Strange Flush">
  </a>
</div>

<div id="hero-text">
  <div class="line1">Nicholas ♦ EJ &nbsp;&nbsp;·&nbsp;&nbsp; Only Event &nbsp;&nbsp;·&nbsp;&nbsp; 2027</div>
  <div class="line2">ANTHOLOGY 2</div>
</div>

<script>
const authors = [
  { name:"개좋음",   handle:"@crycrycrycrycxx", url:"https://twitter.com/crycrycrycrycxx", suits:["♥","♠","♦"], rank:"A"  },
  { name:"딸기공격", handle:"@00079000_",        url:"https://twitter.com/00079000_",        suits:["♣","♥","♦"], rank:"2"  },
  { name:"무끼",     handle:"@mukkime",          url:"https://twitter.com/mukkime",          suits:["♠","♦","♣"], rank:"3"  },
  { name:"변칸쵸",   handle:"@B_kancho_",        url:"https://twitter.com/B_kancho_",        suits:["♥","♣","♠"], rank:"4"  },
  { name:"산마",     handle:"@gomihodai",        url:"https://twitter.com/gomihodai",        suits:["♦","♥","♣"], rank:"5"  },
  { name:"양",       handle:"@8_r0o",            url:"https://twitter.com/8_r0o",            suits:["♣","♠","♥"], rank:"6"  },
  { name:"외네",     handle:"@oene___",          url:"https://twitter.com/oene___",          suits:["♦","♠","♣"], rank:"7"  },
  { name:"키득먼",   handle:"@nicokidding",      url:"https://twitter.com/nicokidding",      suits:["♥","♦","♠"], rank:"8"  },
  { name:"247",      handle:"@twntyforsvn247",   url:"https://twitter.com/twntyforsvn247",   suits:["♣","♥","♦"], rank:"9"  },
  { name:"cedar",    handle:"@cedarinrnml",      url:"https://twitter.com/cedarinrnml",      suits:["♠","♣","♥"], rank:"10" },
  { name:"dd",       handle:null,                url:"#",                                    suits:["♦","♣","♠"], rank:"J"  },
  { name:"hikari",   handle:"@7997_hikari",      url:"https://twitter.com/7997_hikari",      suits:["♥","♣","♦"], rank:"Q"  },
  { name:"okon",     handle:"@milk_milk_okon",   url:"https://twitter.com/milk_milk_okon",   suits:["♠","♥","♣"], rank:"K"  },
];

/* ── 데스크탑 포지션 ── */
const SCATTER_DESK = [
  { x:22, y:18, r:-44, s:1.2  }, { x:20, y:55, r:-26, s:1.15 },
  { x:22, y:82, r:-52, s:1.05 }, { x:32, y:10, r:-16, s:1.1  },
  { x:34, y:80, r:-36, s:1.0  }, { x:78, y:18, r: 48, s:1.2  },
  { x:80, y:58, r: 30, s:1.15 }, { x:78, y:82, r: 58, s:1.05 },
  { x:68, y:10, r: 22, s:1.1  }, { x:66, y:80, r: 38, s:1.0  },
  { x:40, y: 8, r: -8, s:1.0  }, { x:60, y: 8, r: 11, s:0.98 },
  { x:50, y:88, r:  4, s:1.05 },
];
const DECOR_DESK = [
  { x:32, y:36, r: 16, s:1.05 }, { x:40, y:22, r: -7, s:1.0  },
  { x:38, y:82, r: 20, s:0.98 }, { x:62, y:82, r:-16, s:0.98 },
  { x:60, y:22, r: 10, s:1.0  }, { x:68, y:40, r: 44, s:1.05 },
  { x:50, y: 4, r: -4, s:0.92 }, { x:16, y:46, r:-68, s:1.0  },
  { x:84, y:52, r: 70, s:1.0  }, { x:30, y:92, r: 28, s:0.88 },
  { x:70, y:92, r:-24, s:0.88 },
];

/*
 * 모바일 포지션 — 로고(50%,50%)를 중심으로 원형 배치.
 * 세로 화면 보정: rx≈36vw, ry≈32vh → 픽셀상 거의 원형
 * SCATTER: 바깥 원, DECOR: 안쪽 원
 */
const SCATTER_MOB = [
  { x:47, y:13, r: -8,  s:1.0  },
  { x:66, y:17, r: 20,  s:1.0  },
  { x:79, y:28, r: 46,  s:1.0  },
  { x:88, y:43, r: 74,  s:1.0  },
  { x:84, y:62, r:106,  s:1.0  },
  { x:73, y:73, r:130,  s:1.0  },
  { x:56, y:83, r:160,  s:1.0  },
  { x:38, y:82, r:-158, s:1.0  },
  { x:22, y:75, r:-138, s:1.0  },
  { x:11, y:61, r:-112, s:1.0  },
  { x:12, y:44, r: -84, s:1.0  },
  { x:19, y:28, r: -55, s:1.0  },
  { x:35, y:18, r: -27, s:1.0  },
];
const DECOR_MOB = [
  { x:51, y:26, r: -8,  s:0.95 },
  { x:65, y:29, r: 20,  s:0.95 },
  { x:74, y:38, r: 48,  s:0.95 },
  { x:78, y:53, r: 80,  s:0.9  },
  { x:70, y:65, r:104,  s:0.95 },
  { x:57, y:72, r:130,  s:0.9  },
  { x:42, y:71, r:-130, s:0.9  },
  { x:29, y:65, r:-104, s:0.95 },
  { x:23, y:52, r: -78, s:0.9  },
  { x:27, y:38, r: -50, s:0.95 },
  { x:37, y:29, r: -24, s:0.95 },
];

const MESSAGES = [
  "다른 카드를\n뒤집어주세요.",
  "주주 찐자\n바보..",
  "그냥 내가 말하면\n화 풀리던데..",
  "너랑 있을 때\n가장 나다운 내가\n되는 것 같아.",
  "가끔 싸우거나 이유 없이\n짜증낼 적도 있었지만\n사실은 니콜라스가\n옆에 있어줘서 기뻐.",
  "네가 안 귀여우면\n누가 귀여워?",
  "반지 사이즈\n어떻게 알았어?",
  "내 새끼 손가락.",
  "우리 주주\n또 사고쳤네.",
  "의주는 저에게\n대체불가한 존재예요.",
];

const RED     = new Set(["♥","♦"]);
const sc      = s => RED.has(s) ? 'sr' : 'sb';
const isTouch = !window.matchMedia('(hover: hover) and (pointer: fine)').matches;
const SCATTER = isTouch ? SCATTER_MOB : SCATTER_DESK;
const DECOR   = isTouch ? DECOR_MOB   : DECOR_DESK;

let currentFlipped = null;
let heroTimer      = null;
const hero = document.getElementById('hero');

/* 카드 떠오르기 — 로고 위로 오도록 hero를 일시적으로 낮춤 */
function flipCard(wrap) {
  if (heroTimer) { clearTimeout(heroTimer); heroTimer = null; }
  /* 이전 카드 복귀 (hero 타이머 없이) */
  if (currentFlipped) {
    const prev = currentFlipped;
    currentFlipped = null;
    prev.classList.add('returning');
    prev.classList.remove('flipped');
    setTimeout(() => prev.classList.remove('returning'), 420);
  }
  hero.style.zIndex = '1';   /* hero를 card-field(z:2) 아래로 */
  currentFlipped = wrap;
  wrap.style.zIndex = '999';
  wrap.classList.add('flipped');
}

/* 카드 복귀 — 배경 탭 */
function closeFlipped() {
  if (!currentFlipped) return;
  const c = currentFlipped;
  currentFlipped = null;
  c.classList.add('returning');
  c.classList.remove('flipped');
  c.style.zIndex = '';
  setTimeout(() => c.classList.remove('returning'), 420);
  /* 복귀 완료 후 hero 원상 복구 */
  if (heroTimer) clearTimeout(heroTimer);
  heroTimer = setTimeout(() => {
    hero.style.zIndex = '';
    heroTimer = null;
  }, 450);
}

function backHTML() {
  const SUITS = ['♠','♥','♦','♣'];
  return `<div class="cf cb"><div class="cb-hatch"></div><div class="cb-s">${SUITS[Math.floor(Math.random()*4)]}</div></div>`;
}

function makeCard(author, pos) {
  const wrap = document.createElement('div');
  wrap.className = 'cw';
  wrap.style.left = pos.x + 'vw';
  wrap.style.top  = pos.y + 'vh';
  wrap.style.setProperty('--r',  pos.r + 'deg');
  wrap.style.setProperty('--s',  pos.s);
  wrap.style.setProperty('--ox', pos.x + 'vw');
  wrap.style.setProperty('--oy', pos.y + 'vh');

  const topS   = author.suits[0];
  const cls    = sc(topS);
  const suitsH = author.suits.map(s => `<span class="${sc(s)}">${s}</span>`).join('');

  /* 이름·핸들 — 모바일에서만 <a> 링크 */
  const hasLink = author.url && author.url !== '#';
  const nameEl   = hasLink && isTouch
    ? `<a class="cname" style="color:#1a0808" href="${author.url}" target="_blank" rel="noopener">${author.name}</a>`
    : `<div class="cname">${author.name}</div>`;
  const handleEl = author.handle
    ? (hasLink ? `<a class="chandle" href="${author.url}" target="_blank" rel="noopener">${author.handle}</a>`
                : `<div class="chandle">${author.handle}</div>`)
    : '';

  wrap.innerHTML = `
    <div class="ci">
      ${backHTML()}
      <div class="cf cfront">
        <div class="corner c-tl"><div class="rk ${cls}">${author.rank}</div><div class="st ${cls}">${topS}</div></div>
        <div class="cmid">
          <div class="suits-row">${suitsH}</div>
          ${nameEl}${handleEl}
        </div>
        <div class="corner c-br"><div class="rk ${cls}">${author.rank}</div><div class="st ${cls}">${topS}</div></div>
      </div>
    </div>`;

  if (isTouch) {
    wrap.querySelectorAll('a[href]').forEach(a => {
      a.addEventListener('click', (e) => e.stopPropagation());
    });
    wrap.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!wrap.classList.contains('flipped')) flipCard(wrap);
      else closeFlipped();
    });
  } else if (hasLink) {
    wrap.addEventListener('click', () => window.open(author.url, '_blank', 'noopener'));
  }
  return wrap;
}

function makeDecorCard(pos, msgIdx) {
  const wrap = document.createElement('div');
  wrap.className = 'cw';
  wrap.style.left = pos.x + 'vw';
  wrap.style.top  = pos.y + 'vh';
  wrap.style.setProperty('--r',  pos.r + 'deg');
  wrap.style.setProperty('--s',  pos.s);
  wrap.style.setProperty('--ox', pos.x + 'vw');
  wrap.style.setProperty('--oy', pos.y + 'vh');
  wrap.style.zIndex = '6';

  wrap.innerHTML = `
    <div class="ci">
      ${backHTML()}
      <div class="cf cmsg"><div class="cmsg-text">${MESSAGES[msgIdx % MESSAGES.length].replace(/\n/g,'<br>')}</div></div>
    </div>`;

  if (isTouch) {
    wrap.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!wrap.classList.contains('flipped')) flipCard(wrap);
      else closeFlipped();
    });
  } else {
    wrap.addEventListener('click', () => wrap.classList.toggle('flipped'));
  }
  return wrap;
}

document.addEventListener('DOMContentLoaded', () => {
  const field = document.getElementById('card-field');

  if (isTouch) {
    field.addEventListener('click', () => closeFlipped());
  }

  authors.forEach((a, i) => field.appendChild(makeCard(a, SCATTER[i])));

  const msgOrder = MESSAGES.map((_, i) => i).sort(() => Math.random() - 0.5);
  DECOR.forEach((pos, i) => field.appendChild(makeDecorCard(pos, msgOrder[i])));
});
</script>
</body>
</html>
